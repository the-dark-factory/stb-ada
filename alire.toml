name = "df_stb"
description = "Ada bindings to Sean Barrett's STB header-only utility libraries"
version = "0.1.0"
authors = ["The Dark Factory Ltd"]
maintainers = ["tony.gair@thedarkfactory.co.uk"]
maintainers-logins = ["tonygair"]
licenses = "MIT"
website = "https://github.com/the-dark-factory/stb-ada"
tags = ["binding", "image", "stb", "stb-image", "stb-truetype"]
project-files = ["df_stb.gpr"]
auto-gpr-with = false
notes = "STB is header-only C; the single implementation unit csrc/stb_impl.c is compiled by gprbuild as part of `alr build` (the project's Languages include C). No pre-build step. macOS: set SDKROOT if the toolchain needs the SDK headers."

[build-switches]
"*".style_checks = ["-gnaty"]

[available.'case(os)']
macos = true
linux = true
windows = false  # Untested.
